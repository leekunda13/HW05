<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1280" viewBox="0 0 820 1280" role="img" aria-labelledby="title desc">
  <title id="title">Commit-aware continuous performance testing flow</title>
  <desc id="desc">A gated pipeline from commit classification through smoke, performance profiles, baseline comparison, repeat confirmation, artifact retention, and human-approved baseline updates.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2866a7"/>
    </marker>
    <style>
      .node { fill: #eef5fc; stroke: #2866a7; stroke-width: 2; rx: 10; }
      .gate { fill: #fff8e6; stroke: #b7791f; stroke-width: 2; }
      .success { fill: #edf9f0; stroke: #2f855a; stroke-width: 2; rx: 10; }
      .failure { fill: #fff1f1; stroke: #c53030; stroke-width: 2; rx: 10; }
      .line { fill: none; stroke: #2866a7; stroke-width: 2.2; marker-end: url(#arrow); }
      .label { font: 600 16px Arial, sans-serif; fill: #173f70; text-anchor: middle; }
      .small { font: 14px Arial, sans-serif; fill: #172033; text-anchor: middle; }
      .branch { font: 700 13px Arial, sans-serif; fill: #6b4f16; }
    </style>
  </defs>

  <rect class="node" x="210" y="20" width="400" height="64"/>
  <text class="label" x="410" y="47">Commit, pull request, schedule,</text>
  <text class="small" x="410" y="69">or manual release trigger</text>

  <path class="line" d="M410 84 V120"/>
  <polygon class="gate" points="410,120 570,180 410,240 250,180"/>
  <text class="label" x="410" y="175">Relevant backend, DB,</text>
  <text class="small" x="410" y="197">test-plan, or scheduled change?</text>

  <path class="line" d="M250 180 H130 V270"/>
  <text class="branch" x="155" y="169">NO</text>
  <rect class="success" x="25" y="270" width="210" height="70"/>
  <text class="label" x="130" y="299">Record skip decision</text>
  <text class="small" x="130" y="321">No performance job</text>

  <path class="line" d="M410 240 V270"/>
  <text class="branch" x="424" y="261">YES</text>
  <rect class="node" x="280" y="270" width="260" height="70"/>
  <text class="label" x="410" y="299">Run smoke gate</text>
  <text class="small" x="410" y="321">Assertions and health checks</text>

  <path class="line" d="M540 305 H670 V380"/>
  <text class="branch" x="568" y="294">FAIL</text>
  <rect class="failure" x="575" y="380" width="220" height="78"/>
  <text class="label" x="685" y="409">Fail early</text>
  <text class="small" x="685" y="431">Archive logs; no load test</text>

  <path class="line" d="M410 340 V380"/>
  <text class="branch" x="424" y="365">PASS</text>
  <rect class="node" x="245" y="380" width="330" height="88"/>
  <text class="label" x="410" y="408">Select profile by risk</text>
  <text class="small" x="410" y="431">PR: Load | nightly: Stress + Spike</text>
  <text class="small" x="410" y="451">weekly/release: Soak</text>

  <path class="line" d="M410 468 V505"/>
  <rect class="node" x="210" y="505" width="400" height="78"/>
  <text class="label" x="410" y="534">Prepare controlled runner</text>
  <text class="small" x="410" y="556">Pinned host, clean DB, fixed data and JMX</text>

  <path class="line" d="M410 583 V620"/>
  <rect class="node" x="210" y="620" width="400" height="78"/>
  <text class="label" x="410" y="649">Run selected profile</text>
  <text class="small" x="410" y="671">Save full JTL, HTML, resource, and metadata</text>

  <path class="line" d="M410 698 V735"/>
  <rect class="node" x="210" y="735" width="400" height="78"/>
  <text class="label" x="410" y="764">Calculate candidate metrics</text>
  <text class="small" x="410" y="786">p95, p99, errors, throughput, completions</text>

  <path class="line" d="M410 813 V845"/>
  <polygon class="gate" points="410,845 570,905 410,965 250,905"/>
  <text class="label" x="410" y="899">Regression against same-host,</text>
  <text class="small" x="410" y="921">approved baseline?</text>

  <path class="line" d="M250 905 H130 V995"/>
  <text class="branch" x="157" y="894">NO</text>
  <rect class="success" x="25" y="995" width="210" height="76"/>
  <text class="label" x="130" y="1025">Pass and archive</text>
  <text class="small" x="130" y="1047">Do not auto-change baseline</text>

  <path class="line" d="M410 965 V995"/>
  <text class="branch" x="424" y="986">YES</text>
  <rect class="node" x="285" y="995" width="250" height="76"/>
  <text class="label" x="410" y="1025">Repeat once clean</text>
  <text class="small" x="410" y="1047">Confirm or quarantine noise</text>

  <path class="line" d="M410 1071 V1090"/>
  <polygon class="gate" points="410,1090 505,1130 410,1170 315,1130"/>
  <text class="label" x="410" y="1125">Regression persists?</text>
  <text class="small" x="410" y="1146">Same clean environment</text>

  <path class="line" d="M315 1130 H150 V1190"/>
  <text class="branch" x="242" y="1119">NO</text>
  <rect class="success" x="25" y="1190" width="250" height="70"/>
  <text class="label" x="150" y="1219">Noise or approved change</text>
  <text class="small" x="150" y="1241">Human owns baseline update</text>

  <path class="line" d="M505 1130 H670 V1190"/>
  <text class="branch" x="557" y="1119">YES</text>
  <rect class="failure" x="545" y="1190" width="250" height="70"/>
  <text class="label" x="670" y="1219">Persistent regression</text>
  <text class="small" x="670" y="1241">Flag/block; human triage</text>
</svg>
